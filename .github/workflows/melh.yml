name: Melħ Protocol 
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: dependencies
      run: sudo apt-get -y install pkg-config cmake libmodbus-dev libgtest-dev
    - name: Build CMake
        uses: threeal/cmake-action@v2.1.0
        source-dir: melh-protocol
        build-dir: melh-protocol/build
